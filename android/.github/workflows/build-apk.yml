name: Build Al-Mahala Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Prepare CMake
        run: |
          SDKMANAGER=$(which sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          if [ -x "$SDKMANAGER" ]; then
            yes | $SDKMANAGER --licenses || true
            $SDKMANAGER --install "cmake;3.22.1" || true
          fi

      - name: Grant Gradle execute permission
        run: chmod +x gradlew || true

      - name: Clean and Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlMahala-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
